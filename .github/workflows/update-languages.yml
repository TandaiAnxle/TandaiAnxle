
name: Update language bar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_languages.py
      - .github/workflows/update-languages.yml
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate language bar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_languages.py

      - name: Commit updated bar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg languages.png top_languages.png github_stats.png profile.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update language percentages"
            git push
          fi
